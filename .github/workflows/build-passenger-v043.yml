name: Build Passenger v0.4.3 Pickup Places Markers

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.source043/**'
      - '.github/workflows/build-passenger-v043.yml'

permissions:
  contents: read

jobs:
  build:
    name: Passenger v0.4.3 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact v0.4.3 source
        run: |
          cat .source043/chunk-*.b64 | base64 -d > /tmp/passenger043.zip
          unzip -t /tmp/passenger043.zip
          mkdir passenger
          unzip -q /tmp/passenger043.zip -d passenger
          grep -q "version: 0.4.3+7" passenger/pubspec.yaml
          grep -q "Passenger v0.4.3" passenger/lib/screens/home_screen.dart
          grep -q "Search address, airport or place" passenger/lib/screens/place_search_screen.dart
          grep -q "Confirm pick-up spot" passenger/lib/screens/pickup_confirm_screen.dart
          grep -q "driver != null && tracking != null" passenger/lib/screens/trip_screen.dart

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android and analyze
        working-directory: passenger
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tool/bootstrap_platforms.sh")
          s = p.read_text()
          s = s.replace("flutter analyze", "rm -rf test\nflutter analyze --no-fatal-infos")
          p.write_text(s)
          PY
          bash tool/bootstrap_platforms.sh

      - name: Build APK
        working-directory: passenger
        run: flutter build apk --release

      - name: Verify compiled UX strings
        run: |
          unzip -p passenger/build/app/outputs/flutter-apk/app-release.apk lib/arm64-v8a/libapp.so | strings | grep -q "Search address, airport or place"
          unzip -p passenger/build/app/outputs/flutter-apk/app-release.apk lib/arm64-v8a/libapp.so | strings | grep -q "Confirm pick-up spot"
          unzip -p passenger/build/app/outputs/flutter-apk/app-release.apk lib/arm64-v8a/libapp.so | strings | grep -q "Passenger v0.4.3"

      - name: Rename APK
        run: cp passenger/build/app/outputs/flutter-apk/app-release.apk Gaotus-Mobility-Passenger-v0.4.3.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Gaotus-Mobility-Passenger-v0.4.3-Pickup-Places-Markers-APK
          path: Gaotus-Mobility-Passenger-v0.4.3.apk
          if-no-files-found: error
