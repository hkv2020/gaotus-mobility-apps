name: Build Driver v0.6.2 Auto Locale

on:
  workflow_dispatch:
  push:
    branches: [ unified-operations-dev ]
    paths:
      - '.driver062/driver-v062.patch.zlib.b64'
      - '.github/workflows/build-driver-v062-auto-locale.yml'

permissions:
  contents: read

jobs:
  build-driver:
    name: Driver v0.6.2 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Driver v0.6.1 Country Aware
        run: |
          { head -c 12000 .driver050final/chunk-00.b64; cat .driver050final/chunk-01.b64 .driver050final/chunk-02.b64 .driver050final/chunk-03.b64 .driver050final/chunk-04.b64 .driver050final/chunk-05.b64; } | base64 -d > /tmp/driver050.zip
          unzip -t /tmp/driver050.zip
          rm -rf /tmp/driver051 driver
          mkdir -p /tmp/driver051
          unzip -q /tmp/driver050.zip -d /tmp/driver051
          cp -a /tmp/driver051/gaotus-mobility-driver-v0.5.0 ./driver
          patch -p1 -d driver < .driver051/driver-v051-signin.patch
          python3 .driver052/patch052.py
          python3 .driver053/patch053.py
          python3 .driver054/patch054.py
          python3 .driver055/patch055.py
          python3 .driver056/patch056.py
          python3 .driver057/patch057.py
          python3 .driver058/patch058.py
          python3 .driver059/patch059.py
          python3 .driver059fix/patch059fix.py
          python3 - <<'PY'
          from pathlib import Path
          import base64,zlib
          blob=Path('.driver060/driver-v060.patch.zlib.b64').read_text().strip()
          Path('/tmp/driver060.patch').write_bytes(zlib.decompress(base64.b64decode(blob)))
          PY
          patch -p1 -d driver < /tmp/driver060.patch
          grep -q 'version: 0.6.0+15' driver/pubspec.yaml
          python3 .driver061/patch061.py
          grep -q 'version: 0.6.1+16' driver/pubspec.yaml
          grep -q "static const String version = '0.6.1';" driver/lib/config/app_config.dart
          grep -q 'class CountryConfig' driver/lib/core/country_config.dart

      - name: Apply Driver v0.6.2 Auto Locale
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,zlib,hashlib
          expected='116fe33ed476de82ca93f8a2ab917251557bd50c010b862f0b038cce02de1693'
          blob=Path('.driver062/driver-v062.patch.zlib.b64').read_text().strip()
          raw=zlib.decompress(base64.b64decode(blob))
          actual=hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f'Driver v0.6.2 patch hash mismatch: {actual}')
          Path('/tmp/driver062.patch').write_bytes(raw)
          PY
          patch -p1 -d driver < /tmp/driver062.patch
          grep -q 'version: 0.6.2+17' driver/pubspec.yaml
          grep -q "static const String version = '0.6.2';" driver/lib/config/app_config.dart
          grep -q 'class AppLocale' driver/lib/core/app_locale.dart
          grep -q "import 'dart:ui' show PlatformDispatcher;" driver/lib/core/app_locale.dart
          grep -q "static String language = 'en';" driver/lib/core/country_config.dart
          grep -q 'flutter_localizations:' driver/pubspec.yaml
          grep -R -q 'gmp_trip_requests_v4' driver/lib
          grep -R -q 'gmp_driver_messages_v4' driver/lib
          grep -R -q 'gaotus_alert_long' driver/lib driver/android || true
          ! grep -n "'Jobs': 'Joburi'" driver/lib/core/app_locale.dart | tail -n +2 | grep -q .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android and analyze
        working-directory: driver
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tool/bootstrap_platforms.sh')
          p.write_text(p.read_text().replace('flutter analyze','rm -rf test\nflutter analyze --no-fatal-infos'))
          PY
          bash tool/bootstrap_platforms.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          s=p.read_text()
          if 'isCoreLibraryDesugaringEnabled' not in s:
              s=s.replace('compileOptions {','compileOptions {\n        isCoreLibraryDesugaringEnabled = true',1)
          if 'coreLibraryDesugaring(' not in s:
              s+='\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          p.write_text(s)
          PY
          flutter analyze --no-fatal-infos

      - name: Build APK
        working-directory: driver
        run: flutter build apk --release

      - name: Package artifacts
        run: |
          cp driver/build/app/outputs/flutter-apk/app-release.apk Gaotus-Mobility-Driver-v0.6.2-Auto-Locale.apk
          zip -qr Gaotus-Mobility-Driver-v0.6.2-Auto-Locale-SOURCE.zip driver -x 'driver/build/*' 'driver/.dart_tool/*' 'driver/android/.gradle/*' 'driver/.idea/*'
          sha256sum Gaotus-Mobility-Driver-v0.6.2-Auto-Locale.apk Gaotus-Mobility-Driver-v0.6.2-Auto-Locale-SOURCE.zip | tee SHA256SUMS-DRIVER-V062.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Gaotus-Mobility-Driver-v0.6.2-Auto-Locale
          path: |
            Gaotus-Mobility-Driver-v0.6.2-Auto-Locale.apk
            Gaotus-Mobility-Driver-v0.6.2-Auto-Locale-SOURCE.zip
            SHA256SUMS-DRIVER-V062.txt
          if-no-files-found: error
