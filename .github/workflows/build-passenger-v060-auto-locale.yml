name: Build Passenger v0.6.0 Auto Locale

on:
  workflow_dispatch:
  push:
    branches: [ unified-operations-dev ]
    paths:
      - '.passenger060/passenger-v060.patch.zlib.b64'
      - '.github/workflows/build-passenger-v060-auto-locale.yml'

permissions:
  contents: read

jobs:
  build:
    name: Passenger v0.6.0 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Passenger v0.5.9 Country Aware
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          path=Path('.github/workflows/build-passenger-v057.yml')
          lines=path.read_text().splitlines(); blocks=[]; i=0
          while i < len(lines):
              if 'uses: actions/setup-java@v4' in lines[i]: break
              if lines[i].startswith('        run: |'):
                  i+=1; body=[]
                  while i < len(lines):
                      cur=lines[i]
                      if cur.startswith('      - '): break
                      if cur.startswith('          '): body.append(cur[10:])
                      elif cur.strip()=='': body.append('')
                      else: body.append(cur.lstrip())
                      i+=1
                  blocks.append('\n'.join(body)); continue
              i+=1
          if not blocks: raise SystemExit('No canonical Passenger v0.5.7 reconstruction blocks found')
          for block in blocks: subprocess.run(['bash','-euo','pipefail','-c',block],check=True)
          PY
          cat .passenger058/patch-00 .passenger058/patch-01 .passenger058/patch-02 .passenger058/patch-03 > /tmp/passenger058.patch
          patch -p2 -d passenger < /tmp/passenger058.patch
          grep -q 'version: 0.5.8+19' passenger/pubspec.yaml
          python3 .passenger059/patch059.py
          grep -q 'version: 0.5.9+20' passenger/pubspec.yaml
          grep -q "static const version = '0.5.9';" passenger/lib/config/app_config.dart
          grep -q 'class CountryConfig' passenger/lib/core/country_config.dart

      - name: Apply Passenger v0.6.0 Auto Locale
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,zlib,hashlib
          expected='361213a1b0545827f946220c2eb23d2fa320fc1a363b7f2fecbc6c7f6b135d36'
          blob=Path('.passenger060/passenger-v060.patch.zlib.b64').read_text().strip()
          raw=zlib.decompress(base64.b64decode(blob))
          actual=hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f'Passenger v0.6.0 patch hash mismatch: {actual}')
          Path('/tmp/passenger060.patch').write_bytes(raw)
          PY
          patch -p1 -d passenger < /tmp/passenger060.patch
          grep -q 'version: 0.6.0+21' passenger/pubspec.yaml
          grep -q "static const version = '0.6.0';" passenger/lib/config/app_config.dart
          grep -q 'class AppLocale' passenger/lib/core/app_locale.dart
          grep -q "import 'dart:ui' show PlatformDispatcher;" passenger/lib/core/app_locale.dart
          grep -q "static String language = 'en';" passenger/lib/core/country_config.dart
          grep -q 'flutter_localizations:' passenger/pubspec.yaml
          grep -R -q 'gmp_passenger_updates_v3' passenger/lib
          grep -R -q 'gmp_passenger_messages_v3' passenger/lib
          grep -R -q 'gaotus_alert' passenger/lib passenger/android || true
          ! grep -n "'Collection': 'Colectare'" passenger/lib/core/app_locale.dart | tail -n +2 | grep -q .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android and analyze
        working-directory: passenger
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tool/bootstrap_platforms.sh')
          p.write_text(p.read_text().replace('flutter analyze','rm -rf test\nflutter analyze --no-fatal-infos'))
          PY
          bash tool/bootstrap_platforms.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          if not p.exists(): raise SystemExit('android/app/build.gradle.kts missing')
          s=p.read_text()
          if 'isCoreLibraryDesugaringEnabled = true' not in s:
              s=s.replace('compileOptions {','compileOptions {\n        isCoreLibraryDesugaringEnabled = true',1)
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' not in s:
              s+='\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          p.write_text(s)
          PY
          flutter analyze --no-fatal-infos

      - name: Build APK
        working-directory: passenger
        run: flutter build apk --release

      - name: Package artifacts
        run: |
          cp passenger/build/app/outputs/flutter-apk/app-release.apk Gaotus-Mobility-Passenger-v0.6.0-Auto-Locale.apk
          zip -qr Gaotus-Mobility-Passenger-v0.6.0-Auto-Locale-SOURCE.zip passenger -x 'passenger/build/*' 'passenger/.dart_tool/*' 'passenger/android/.gradle/*' 'passenger/.idea/*'
          sha256sum Gaotus-Mobility-Passenger-v0.6.0-Auto-Locale.apk Gaotus-Mobility-Passenger-v0.6.0-Auto-Locale-SOURCE.zip | tee SHA256SUMS-PASSENGER-V060.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Gaotus-Mobility-Passenger-v0.6.0-Auto-Locale
          path: |
            Gaotus-Mobility-Passenger-v0.6.0-Auto-Locale.apk
            Gaotus-Mobility-Passenger-v0.6.0-Auto-Locale-SOURCE.zip
            SHA256SUMS-PASSENGER-V060.txt
          if-no-files-found: error
