name: Build Driver v0.5.3 Dispatch Self-Heal

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.driver051/**'
      - '.driver052/**'
      - '.driver053/**'
      - '.github/workflows/build-driver-v053.yml'

permissions:
  contents: read

jobs:
  build-driver:
    name: Driver v0.5.3 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Driver v0.5.0 source
        run: |
          { head -c 12000 .driver050final/chunk-00.b64; cat .driver050final/chunk-01.b64 .driver050final/chunk-02.b64 .driver050final/chunk-03.b64 .driver050final/chunk-04.b64 .driver050final/chunk-05.b64; } | base64 -d > /tmp/driver050.zip
          unzip -t /tmp/driver050.zip
          rm -rf /tmp/driver051 driver
          mkdir -p /tmp/driver051
          unzip -q /tmp/driver050.zip -d /tmp/driver051
          cp -a /tmp/driver051/gaotus-mobility-driver-v0.5.0 ./driver

      - name: Apply v0.5.1 sign-in hotfix
        run: |
          patch -p1 -d driver < .driver051/driver-v051-signin.patch
          python3 .driver052/patch052.py
          python3 .driver053/patch053.py
          grep -q "version: 0.5.3+8" driver/pubspec.yaml
          grep -q "pollDriverEvents" driver/lib/services/realtime_service.dart
          grep -q "liveSnapshot" driver/lib/state/app_session.dart
          grep -q "_wordpressHeartbeatTimer" driver/lib/state/app_session.dart
          grep -q "/driver/live-snapshot" driver/lib/core/api_client.dart
          grep -q "New passenger request nearby" driver/lib/services/offer_notification_service.dart
          grep -q "GPS live" driver/lib/screens/driver_home_screen.dart
          grep -q "static const String version = '0.5.3';" driver/lib/config/app_config.dart
          grep -q "_finishLoginBootstrap" driver/lib/state/app_session.dart
          grep -q "authenticated = true;" driver/lib/state/app_session.dart
          grep -q "SIGNING IN" driver/lib/screens/login_screen.dart

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Prepare Android and analyze
        working-directory: driver
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tool/bootstrap_platforms.sh")
          s = p.read_text()
          s = s.replace("flutter analyze", "rm -rf test\nflutter analyze --no-fatal-infos")
          p.write_text(s)
          PY
          bash tool/bootstrap_platforms.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          if "isCoreLibraryDesugaringEnabled" not in s:
              s = s.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
          if "coreLibraryDesugaring(" not in s:
              s += "\n\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")\n}\n"
          p.write_text(s)
          PY

      - name: Build APK
        working-directory: driver
        run: flutter build apk --release

      - name: Rename APK
        run: cp driver/build/app/outputs/flutter-apk/app-release.apk Gaotus-Mobility-Driver-v0.5.3-Dispatch-Self-Heal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Gaotus-Mobility-Driver-v0.5.3-Dispatch-Self-Heal-APK
          path: Gaotus-Mobility-Driver-v0.5.2-Live-Dispatch.apk
          if-no-files-found: error
