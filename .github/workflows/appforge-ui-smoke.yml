name: AppForge Native UI Smoke Build

on:
  workflow_dispatch:
  push:
    branches: ["appforge-mvp"]
    paths:
      - "appforge-mvp/clients/ui-smoke.json"
      - "appforge-mvp/scripts/patch-android-ui.mjs"
      - "appforge-mvp/scripts/patch-android-back.mjs"
      - ".github/workflows/appforge-ui-smoke.yml"

defaults:
  run:
    working-directory: appforge-mvp

jobs:
  android-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Generate UI smoke config
        run: node scripts/generate-client.mjs clients/ui-smoke.json
      - name: Add Android platform
        run: npx cap add android
      - name: Apply advanced native runtime
        run: npx cap sync android && node scripts/patch-native.mjs android && node scripts/patch-android-back.mjs && node scripts/patch-android-ui.mjs
      - name: Build UI smoke APK
        run: cd android && ./gradlew assembleDebug --no-daemon
