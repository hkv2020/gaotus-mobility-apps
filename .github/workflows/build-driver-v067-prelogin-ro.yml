name: Build Driver v0.6.7 Prelogin RO

on:
  push:
    branches: [ chat-notifications-hotfix ]
    paths:
      - '.driver067/**'
      - '.github/workflows/build-driver-v067-prelogin-ro.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Driver v0.6.7 Prelogin RO
        run: bash .driver067/build067-prelogin-ro.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Gaotus-Mobility-Driver-v0.6.7-PRELOGIN-RO
          path: |
            Gaotus-Mobility-Driver-v0.6.7-PRELOGIN-RO.apk
            Gaotus-Mobility-Driver-v0.6.7-PRELOGIN-RO-SOURCE.zip
            SHA256SUMS-DRIVER-V067.txt
          if-no-files-found: error
