name: Build Driver v0.5.9 Unified Operations

on:
  push:
    branches: [ unified-operations-dev ]
    paths:
      - '.driver059/**'
      - '.github/workflows/build-driver-v059-unified-operations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-driver:
    name: Driver v0.5.9 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Driver v0.5.8 source
        run: |
          { head -c 12000 .driver050final/chunk-00.b64; cat .driver050final/chunk-01.b64 .driver050final/chunk-02.b64 .driver050final/chunk-03.b64 .driver050final/chunk-04.b64 .driver050final/chunk-05.b64; } | base64 -d > /tmp/driver050.zip
          unzip -t /tmp/driver050.zip
          rm -rf /tmp/driver051 driver
          mkdir -p /tmp/driver051
          unzip -q /tmp/driver050.zip -d /tmp/driver051
          cp -a /tmp/driver051/gaotus-mobility-driver-v0.5.0 ./driver
          patch -p1 -d driver < .driver051/driver-v051-signin.patch
          python3 .driver052/patch052.py
          python3 .driver053/patch053.py
          python3 .driver054/patch054.py
          python3 .driver055/patch055.py
          python3 .driver056/patch056.py
          python3 .driver057/patch057.py
          python3 .driver058/patch058.py
          grep -q 'version: 0.5.8+13' driver/pubspec.yaml

      - name: Apply Driver v0.5.9 Unified Operations
        run: |
          python3 .driver059/patch059.py
          grep -q 'version: 0.5.9+14' driver/pubspec.yaml
          grep -q "static const String version = '0.5.9';" driver/lib/config/app_config.dart
          grep -q 'OperationsJobScreen' driver/lib/screens/operations_job_screen.dart
          grep -q 'image_picker' driver/pubspec.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Prepare Android and analyze
        working-directory: driver
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tool/bootstrap_platforms.sh')
          s = p.read_text().replace('flutter analyze', 'rm -rf test\nflutter analyze --no-fatal-infos')
          p.write_text(s)
          PY
          bash tool/bootstrap_platforms.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          if 'isCoreLibraryDesugaringEnabled' not in s:
              s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          if 'coreLibraryDesugaring(' not in s:
              s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          p.write_text(s)
          PY
          flutter analyze --no-fatal-infos

      - name: Build APK
        working-directory: driver
        run: flutter build apk --release

      - name: Package artifacts
        run: |
          cp driver/build/app/outputs/flutter-apk/app-release.apk Gaotus-Mobility-Driver-v0.5.9-Unified-Operations.apk
          zip -qr Gaotus-Mobility-Driver-v0.5.9-Unified-Operations-SOURCE.zip driver
          sha256sum Gaotus-Mobility-Driver-v0.5.9-Unified-Operations.apk Gaotus-Mobility-Driver-v0.5.9-Unified-Operations-SOURCE.zip | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Gaotus-Mobility-Driver-v0.5.9-Unified-Operations
          path: |
            Gaotus-Mobility-Driver-v0.5.9-Unified-Operations.apk
            Gaotus-Mobility-Driver-v0.5.9-Unified-Operations-SOURCE.zip
            SHA256SUMS.txt
          if-no-files-found: error
