name: Build Passenger v0.6.5 Firebase RO

on:
  push:
    branches: [ chat-notifications-hotfix ]
    paths:
      - '.passenger065/**'
      - '.firebase/passenger/**'
      - '.github/workflows/build-passenger-v065-firebase-ro.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Passenger v0.6.5 Firebase RO
        run: bash .passenger065/build065-firebase-ro.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Gaotus-Mobility-Passenger-v0.6.5-Firebase-RO
          path: |
            Gaotus-Mobility-Passenger-v0.6.5-Firebase-RO.apk
            Gaotus-Mobility-Passenger-v0.6.5-Firebase-RO-SOURCE.zip
            SHA256SUMS-PASSENGER-V065.txt
          if-no-files-found: error
