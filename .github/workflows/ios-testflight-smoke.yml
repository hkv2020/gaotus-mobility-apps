name: AppForge iOS TestFlight Legacy Probe

on:
  workflow_dispatch:

jobs:
  legacy-probe-retired:
    runs-on: ubuntu-latest
    steps:
      - name: Persistent signing supersedes this probe
        run: |
          echo "[AppForge] This legacy Apple cloud-signing probe is intentionally retired."
          echo "[AppForge] Use ios-testflight-persistent-smoke.yml for CI or appforge-builder.yml from Forge."
          echo "[AppForge] Production signing uses the persistent Apple Distribution certificate and App Store provisioning profile path."
