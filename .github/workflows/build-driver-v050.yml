name: Build Driver v0.5.0 Driver Experience

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.driver050final/**'
      - '.github/workflows/build-driver-v050.yml'

permissions:
  contents: read

jobs:
  build-driver:
    name: Driver v0.5.0 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Driver v0.5.0 source
        run: |
          { head -c 12000 .driver050final/chunk-00.b64; cat .driver050final/chunk-01.b64 .driver050final/chunk-02.b64 .driver050final/chunk-03.b64 .driver050final/chunk-04.b64 .driver050final/chunk-05.b64; } | base64 -d > /tmp/gaotus-mobility-driver-v0.5.0.zip
          echo "19b7e3c4726255421bc5837660d584d5ee80ad5dfa9d1532d7de74f2c49f3a25  /tmp/gaotus-mobility-driver-v0.5.0.zip" | sha256sum -c -
          unzip -t /tmp/gaotus-mobility-driver-v0.5.0.zip
          rm -rf driver /tmp/driver050
          mkdir -p /tmp/driver050
          unzip -q /tmp/gaotus-mobility-driver-v0.5.0.zip -d /tmp/driver050
          cp -a /tmp/driver050/gaotus-mobility-driver-v0.5.0 ./driver
          grep -q "version: 0.5.0+5" driver/pubspec.yaml
          grep -q "flutter_map:" driver/pubspec.yaml
          grep -q "unawaited(session.initialize())" driver/lib/main.dart
          grep -q "_flushLatestLocation" driver/lib/state/app_session.dart
          grep -q "DriverChatScreen" driver/lib/screens/chat_screen.dart
          grep -q "You’re online" driver/lib/screens/driver_home_screen.dart
          grep -q "TODAY" driver/lib/screens/driver_home_screen.dart
          grep -q "Completed trips" driver/lib/screens/earnings_screen.dart

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Prepare Android and analyze
        working-directory: driver
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tool/bootstrap_platforms.sh")
          s = p.read_text()
          s = s.replace("flutter analyze", "rm -rf test\nflutter analyze --no-fatal-infos")
          p.write_text(s)
          PY
          bash tool/bootstrap_platforms.sh

      - name: Build APK
        working-directory: driver
        run: flutter build apk --release

      - name: Rename APK
        run: cp driver/build/app/outputs/flutter-apk/app-release.apk Gaotus-Mobility-Driver-v0.5.0-Driver-Experience.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Gaotus-Mobility-Driver-v0.5.0-Driver-Experience-APK
          path: Gaotus-Mobility-Driver-v0.5.0-Driver-Experience.apk
          if-no-files-found: error
