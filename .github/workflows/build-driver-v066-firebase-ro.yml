name: Build Driver v0.6.6 Firebase RO

on:
  push:
    branches: [ chat-notifications-hotfix ]
    paths:
      - '.driver066/**'
      - '.firebase/driver/**'
      - '.github/workflows/build-driver-v066-firebase-ro.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Driver v0.6.6 Firebase RO
        run: bash .driver066/build066-firebase-ro.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Gaotus-Mobility-Driver-v0.6.6-Firebase-RO
          path: |
            Gaotus-Mobility-Driver-v0.6.6-Firebase-RO.apk
            Gaotus-Mobility-Driver-v0.6.6-Firebase-RO-SOURCE.zip
            SHA256SUMS-DRIVER-V066.txt
          if-no-files-found: error
