name: AppForge Android Smoke Build

on:
  workflow_dispatch:
  push:
    branches: ["appforge-mvp"]
    paths:
      - "appforge-mvp/**"
      - ".github/workflows/android-smoke.yml"

defaults:
  run:
    working-directory: appforge-mvp

jobs:
  android-debug:
    name: factory-base-apk-aab
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Verify Android SDK environment
        run: |
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          if command -v sdkmanager >/dev/null 2>&1; then sdkmanager --version; else echo "sdkmanager is not on PATH; Gradle will use ANDROID_HOME"; fi
      - name: Install factory dependencies
        run: npm install --no-audit --no-fund
      - name: Run factory contract tests
        run: npm test
      - name: Generate base client and feature plan
        run: node scripts/generate-client.mjs clients/demo.json
      - name: Prepare offline screen
        run: node scripts/prepare-offline.mjs
      - name: Add clean Android platform
        run: npx cap add android
      - name: Sync Capacitor shell
        run: npx cap sync android
      - name: Apply canonical verified Android runtime
        run: node scripts/patch-android-runtime.mjs
      - name: Build installable debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Build release AAB
        run: cd android && ./gradlew bundleRelease --no-daemon
      - name: Verify base artifacts
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab
          unzip -tqq android/app/build/outputs/apk/debug/app-debug.apk
          unzip -tqq android/app/build/outputs/bundle/release/app-release.aab
          test -s runtime-verification.json
          test -s generated-feature-plan.json
      - name: Package verified smoke output
        run: node scripts/package-verified-build.mjs smoke-v040
      - name: Verify packaged build contract
        run: |
          test -s dist/smoke-v040.apk
          test -s dist/smoke-v040.aab
          test -s dist/smoke-v040-verification.json
          test -s dist/smoke-v040-feature-plan.json
          test -s dist/smoke-v040-build-report.json
          test -s dist/smoke-v040-config.json
          test -s dist/smoke-v040-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gaotus-appforge-android-smoke
          path: appforge-mvp/dist/
          if-no-files-found: error

  feature-matrix:
    name: feature-matrix (${{ matrix.fixture }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - ui-smoke.json
          - ui-no-refresh-smoke.json
          - permissions-off-smoke.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install factory dependencies
        run: npm install --no-audit --no-fund
      - name: Run factory contract tests
        run: npm test
      - name: Generate fixture and feature plan
        run: node scripts/generate-client.mjs clients/${{ matrix.fixture }}
      - name: Prepare offline screen
        run: node scripts/prepare-offline.mjs
      - name: Add clean Android platform
        run: npx cap add android
      - name: Sync Capacitor shell
        run: npx cap sync android
      - name: Apply canonical verified Android runtime
        run: node scripts/patch-android-runtime.mjs
      - name: Build feature-matrix APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Verify feature-matrix output
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -tqq android/app/build/outputs/apk/debug/app-debug.apk
          test -s runtime-verification.json
