name: AppForge Android Smoke Build

on:
  workflow_dispatch:
  push:
    branches: ["appforge-mvp"]
    paths:
      - "appforge-mvp/**"
      - ".github/workflows/android-smoke.yml"

defaults:
  run:
    working-directory: appforge-mvp

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager || true
          sdkmanager --version || true
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Run generator tests
        run: npm test
      - name: Generate client config
        run: npm run generate
      - name: Add Android platform
        run: npx cap add android
      - name: Sync and patch native shell
        run: npx cap sync android && node scripts/patch-native.mjs android && node scripts/apply-origin-policy.mjs
      - name: Build installable debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Build release AAB (unsigned unless signing is later configured)
        run: cd android && ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gaotus-appforge-android-smoke
          path: |
            appforge-mvp/android/app/build/outputs/apk/debug/app-debug.apk
            appforge-mvp/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
