name: Build Passenger v0.6.7 GPS First Map

on:
  push:
    branches: [ chat-notifications-hotfix ]
    paths:
      - '.passenger067/**'
      - '.github/workflows/build-passenger-v067-gps-first-map.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Passenger v0.6.7 GPS First Map
        run: bash .passenger067/build067-gps-first-map.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Gaotus-Mobility-Passenger-v0.6.7-GPS-FIRST-MAP
          path: |
            Gaotus-Mobility-Passenger-v0.6.7-GPS-FIRST-MAP.apk
            Gaotus-Mobility-Passenger-v0.6.7-GPS-FIRST-MAP-SOURCE.zip
            SHA256SUMS-PASSENGER-V067.txt
          if-no-files-found: error
