name: Export Driver v0.5.8 Source for Unified Operations

on:
  push:
    branches:
      - feature/unified-operations-driver-060
    paths:
      - '.github/workflows/export-driver-v058-source-unified.yml'
      - '.driver060/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-driver-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact Driver v0.5.8 source
        run: |
          { head -c 12000 .driver050final/chunk-00.b64; cat .driver050final/chunk-01.b64 .driver050final/chunk-02.b64 .driver050final/chunk-03.b64 .driver050final/chunk-04.b64 .driver050final/chunk-05.b64; } | base64 -d > /tmp/driver050.zip
          unzip -t /tmp/driver050.zip
          rm -rf /tmp/driver051 driver
          mkdir -p /tmp/driver051
          unzip -q /tmp/driver050.zip -d /tmp/driver051
          cp -a /tmp/driver051/gaotus-mobility-driver-v0.5.0 ./driver
          patch -p1 -d driver < .driver051/driver-v051-signin.patch
          python3 .driver052/patch052.py
          python3 .driver053/patch053.py
          python3 .driver054/patch054.py
          python3 .driver055/patch055.py
          python3 .driver056/patch056.py
          python3 .driver057/patch057.py
          python3 .driver058/patch058.py
          grep -q 'version: 0.5.8+13' driver/pubspec.yaml
          grep -q "static const String version = '0.5.8';" driver/lib/config/app_config.dart

      - name: Create source artifact
        run: |
          find driver -type f -print0 | sort -z | xargs -0 sha256sum > DRIVER-V0.5.8-SOURCE-SHA256SUMS.txt
          zip -qr Gaotus-Mobility-Driver-v0.5.8-EXACT-SOURCE.zip driver DRIVER-V0.5.8-SOURCE-SHA256SUMS.txt
          unzip -t Gaotus-Mobility-Driver-v0.5.8-EXACT-SOURCE.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Gaotus-Mobility-Driver-v0.5.8-EXACT-SOURCE
          path: Gaotus-Mobility-Driver-v0.5.8-EXACT-SOURCE.zip
          if-no-files-found: error
