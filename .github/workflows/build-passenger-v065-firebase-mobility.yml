name: Build Passenger v0.6.5 Firebase Mobility

on:
  push:
    branches: [ chat-notifications-hotfix, unified-operations-dev ]
    paths:
      - '.passenger065/**'
      - '.firebase/passenger/**'
      - '.github/workflows/build-passenger-v065-firebase-mobility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Passenger v0.6.5 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Passenger v0.6.4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          path=Path('.github/workflows/build-passenger-v057.yml')
          lines=path.read_text().splitlines(); blocks=[]; i=0
          while i < len(lines):
              if 'uses: actions/setup-java@v4' in lines[i]: break
              if lines[i].startswith('        run: |'):
                  i+=1; body=[]
                  while i < len(lines):
                      cur=lines[i]
                      if cur.startswith('      - '): break
                      if cur.startswith('          '): body.append(cur[10:])
                      elif cur.strip()=='': body.append('')
                      else: body.append(cur.lstrip())
                      i+=1
                  blocks.append('\n'.join(body)); continue
              i+=1
          for block in blocks: subprocess.run(['bash','-euo','pipefail','-c',block],check=True)
          PY
          cat .passenger058/patch-00 .passenger058/patch-01 .passenger058/patch-02 .passenger058/patch-03 > /tmp/p058.patch
          patch -p2 -d passenger < /tmp/p058.patch
          python3 .passenger059/patch059.py
          python3 .localization-pack/patch_localization.py passenger
          python3 .localization-pack/fix_runtime_const.py passenger
          cat .passenger061/patch-00 .passenger061/patch-01 .passenger061/patch-02 .passenger061/patch-03 .passenger061/patch-04 > /tmp/p061.patch
          patch -p1 -d passenger < /tmp/p061.patch
          patch -p1 -d passenger < .passenger062/passenger-v062-driver-identity-chat.patch
          python3 .passenger062/fix062.py
          python3 .passenger063/fix063.py
          python3 .passenger064/fix064.py
          grep -q 'version: 0.6.4+25' passenger/pubspec.yaml

      - name: Apply Passenger v0.6.5 Firebase activation
        run: |
          python3 .passenger065/fix065.py
          grep -q 'version: 0.6.5+26' passenger/pubspec.yaml
          grep -q "static const version = '0.6.5';" passenger/lib/config/app_config.dart
          grep -q "'/push/register'" passenger/lib/core/api_client.dart
          grep -q 'FirebaseMessaging.instance.getToken' passenger/lib/services/push_service.dart

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android, bind Firebase and analyze
        working-directory: passenger
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tool/bootstrap_platforms.sh')
          p.write_text(p.read_text().replace('flutter analyze','rm -rf test\nflutter analyze --no-fatal-infos'))
          PY
          bash tool/bootstrap_platforms.sh
          cp ../.firebase/passenger/google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          cfg=json.loads(Path('android/app/google-services.json').read_text())
          packages=[c.get('client_info',{}).get('android_client_info',{}).get('package_name','') for c in cfg.get('client',[])]
          assert cfg.get('project_info',{}).get('project_id')=='mobility-9c69a', cfg
          assert 'com.gaotus.mobility.passenger' in packages, packages
          settings=Path('android/settings.gradle.kts')
          s=settings.read_text()
          if 'com.google.gms.google-services' not in s:
              s=s.replace('plugins {','plugins {\n    id("com.google.gms.google-services") version "4.4.4" apply false',1)
          settings.write_text(s)
          app=Path('android/app/build.gradle.kts')
          s=app.read_text()
          if 'id("com.google.gms.google-services")' not in s:
              s=s.replace('plugins {','plugins {\n    id("com.google.gms.google-services")',1)
          if 'isCoreLibraryDesugaringEnabled = true' not in s:
              s=s.replace('compileOptions {','compileOptions {\n        isCoreLibraryDesugaringEnabled = true',1)
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' not in s:
              s+='\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          app.write_text(s)
          assert 'com.google.gms.google-services' in settings.read_text()
          assert 'id("com.google.gms.google-services")' in app.read_text()
          PY
          flutter analyze --no-fatal-infos

      - name: Build APK
        working-directory: passenger
        run: flutter build apk --release

      - name: Verify Firebase resources and package artifacts
        run: |
          test -f passenger/android/app/google-services.json
          grep -q 'mobility-9c69a' passenger/android/app/google-services.json
          grep -q 'com.gaotus.mobility.passenger' passenger/android/app/google-services.json
          cp passenger/build/app/outputs/flutter-apk/app-release.apk Gaotus-Mobility-Passenger-v0.6.5-Firebase-Mobility.apk
          zip -qr Gaotus-Mobility-Passenger-v0.6.5-Firebase-Mobility-SOURCE.zip passenger -x 'passenger/build/*' 'passenger/.dart_tool/*' 'passenger/android/.gradle/*' 'passenger/.idea/*'
          sha256sum Gaotus-Mobility-Passenger-v0.6.5-Firebase-Mobility.apk Gaotus-Mobility-Passenger-v0.6.5-Firebase-Mobility-SOURCE.zip | tee SHA256SUMS-PASSENGER-V065.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Gaotus-Mobility-Passenger-v0.6.5-Firebase-Mobility
          path: |
            Gaotus-Mobility-Passenger-v0.6.5-Firebase-Mobility.apk
            Gaotus-Mobility-Passenger-v0.6.5-Firebase-Mobility-SOURCE.zip
            SHA256SUMS-PASSENGER-V065.txt
          if-no-files-found: error
