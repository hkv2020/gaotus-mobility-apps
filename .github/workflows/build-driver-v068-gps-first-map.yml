name: Build Driver v0.6.8 GPS First Map

on:
  push:
    branches: [ chat-notifications-hotfix ]
    paths:
      - '.driver068/**'
      - '.github/workflows/build-driver-v068-gps-first-map.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Driver v0.6.8 GPS First Map
        run: bash .driver068/build068-gps-first-map.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Gaotus-Mobility-Driver-v0.6.8-GPS-FIRST-MAP
          path: |
            Gaotus-Mobility-Driver-v0.6.8-GPS-FIRST-MAP.apk
            Gaotus-Mobility-Driver-v0.6.8-GPS-FIRST-MAP-SOURCE.zip
            SHA256SUMS-DRIVER-V068.txt
          if-no-files-found: error
