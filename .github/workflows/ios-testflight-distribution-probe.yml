name: AppForge iOS Distribution Signing Probe

on:
  workflow_dispatch:
  push:
    branches: ["appforge-mvp"]
    paths:
      - ".github/workflows/ios-testflight-distribution-probe.yml"

concurrency:
  group: appforge-ios-distribution-probe
  cancel-in-progress: true

defaults:
  run:
    working-directory: appforge-mvp

jobs:
  distribution-probe:
    runs-on: macos-latest
    timeout-minutes: 55
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      APP_STORE_CONNECT_KEY_PATH: /tmp/appforge-AuthKey.p8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Apple API key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APPLE_TEAM_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_API_KEY_P8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$APP_STORE_CONNECT_KEY_PATH"
          chmod 600 "$APP_STORE_CONNECT_KEY_PATH"
          grep -q "BEGIN PRIVATE KEY" "$APP_STORE_CONNECT_KEY_PATH"

      - name: Install factory dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare runtime config
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('clients/gaotus-testflight-smoke.json','utf8'));
          c.versionCode = Number(process.env.BUILD_NUMBER || 1);
          fs.writeFileSync('clients/runtime-testflight.json', JSON.stringify(c, null, 2) + '\n');
          console.log(`[AppForge] TestFlight ${c.appId} ${c.versionName} (${c.versionCode})`);
          NODE

      - name: Verify Apple app record
        env:
          APPLE_REGISTER_BUNDLE_ID: "true"
          APPLE_REQUIRE_APP_RECORD: "true"
        run: node scripts/apple-connect-preflight.mjs clients/runtime-testflight.json

      - name: Generate iOS client
        run: node scripts/generate-client.mjs clients/runtime-testflight.json

      - name: Create iOS project
        run: |
          npx cap add ios
          npx cap sync ios
          node scripts/patch-native.mjs ios
          node scripts/patch-ios-runtime.mjs
          node scripts/verify-ios-runtime.mjs
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist

      - name: Archive with Apple Distribution identity
        shell: bash
        run: |
          set -euo pipefail
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ../../build/testflight/App.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGNING_REQUIRED=YES \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            archive

      - name: Create export options
        shell: bash
        run: |
          mkdir -p build/testflight/export
          cat > build/testflight/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          plutil -lint build/testflight/ExportOptions.plist

      - name: Export signed IPA
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath build/testflight/App.xcarchive \
            -exportPath build/testflight/export \
            -exportOptionsPlist build/testflight/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          IPA=$(find build/testflight/export -maxdepth 1 -name '*.ipa' -type f | head -1)
          test -n "$IPA"
          test -s "$IPA"
          cp "$IPA" build/testflight/Gaotus-TestFlight.ipa
          shasum -a 256 build/testflight/Gaotus-TestFlight.ipa > build/testflight/Gaotus-TestFlight.ipa.sha256

      - name: Validate IPA with App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool --validate-app \
            -f build/testflight/Gaotus-TestFlight.ipa \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --p8-file-path "$APP_STORE_CONNECT_KEY_PATH" \
            --output-format json | tee build/testflight/altool-validate.json

      - name: Upload IPA to TestFlight
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            -f build/testflight/Gaotus-TestFlight.ipa \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --p8-file-path "$APP_STORE_CONNECT_KEY_PATH" \
            --output-format json | tee build/testflight/altool-upload.json

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gaotus-ios-distribution-probe
          path: |
            appforge-mvp/build/testflight/Gaotus-TestFlight.ipa
            appforge-mvp/build/testflight/Gaotus-TestFlight.ipa.sha256
            appforge-mvp/build/testflight/altool-validate.json
            appforge-mvp/build/testflight/altool-upload.json
            appforge-mvp/apple-connect-preflight.json
            appforge-mvp/ios-runtime-verification.json
          if-no-files-found: warn
          retention-days: 7
