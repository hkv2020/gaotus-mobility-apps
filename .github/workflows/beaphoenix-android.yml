name: Beaphoenix AppForge Android Build

on:
  workflow_dispatch:
  push:
    branches: ["appforge-mvp"]
    paths:
      - "appforge-mvp/clients/beaphoenix.json"
      - "appforge-mvp/scripts/**"
      - "appforge-mvp/www/**"
      - ".github/workflows/beaphoenix-android.yml"

defaults:
  run:
    working-directory: appforge-mvp

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Run generator tests
        run: npm test
      - name: Generate Beaphoenix client config
        run: node scripts/generate-client.mjs clients/beaphoenix.json
      - name: Add Android platform
        run: npx cap add android
      - name: Sync and patch native shell
        run: npx cap sync android && node scripts/patch-native.mjs android && node scripts/patch-android-back.mjs
      - name: Build Beaphoenix debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Build Beaphoenix release AAB
        run: cd android && ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: beaphoenix-appforge-android
          path: |
            appforge-mvp/android/app/build/outputs/apk/debug/app-debug.apk
            appforge-mvp/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
